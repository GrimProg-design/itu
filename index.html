<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="icon" href="pictures/logo.png" type="image/png" />
    <title>Расписание</title>
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <div class="header-top">
          <div>
            <div class="eyebrow">группа ИТУ-2-24</div>

            <h1 id="schedule_day">Расписание</h1>
          </div>

          <div class="btn-con">
            <button id="change_user" class="change-user">
              Сменить пользователя
            </button>

            <button id="switch_week" class="change-user">
              Посмотреть знаменатель
            </button>
          </div>
        </div>

        <div class="user-card">
          <div class="user-avatar" id="user_avatar">?</div>

          <div class="user-details">
            <div class="user-name" id="user_name">Пользователь</div>

            <div class="user-meta">
              <span id="user_group"> Группа </span>
              <span class="separator">•</span>
              <span id="user_week"> Неделя </span>
            </div>
          </div>
        </div>

        <nav class="nav">
          <button class="btn active" data-day="all">Вся неделя</button>
          <button class="btn" data-day="monday">Понедельник</button>
          <button class="btn" data-day="tuesday">Вторник</button>
          <button class="btn" data-day="wednesday">Среда</button>
          <button class="btn" data-day="thursday">Четверг</button>
          <button class="btn" data-day="friday">Пятница</button>
          <button class="btn" data-day="saturday">Суббота</button>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="content" id="content"></div>
      <aside class="side-menu" id="side-menu">
        <div class="inner-sidebar-con">
          <div class="links-con">
            <p>☘︎ ݁˖ 𝘴𝘦𝘯𝘥𝘪𝘯𝘨 𝘨𝘰𝘰𝘥 𝘭𝘶𝘤𝘬 *ੈ✩‧₊˚</p>
            <div class="a-button">
              <a href="">Все предметы</a>
            </div>

            <div class="a-button">
              <a href="#" id="teachers-button">Контакты учителей</a>
            </div>
          </div>

          <div class="close-btn-parent">
            <button id="close-btn" class="close-button">✖</button>
          </div>
        </div>
      </aside>
      <button id="open-btn" class="side-button">☰</button>
    </main>

    <footer>Schedule • made by Grimmy</footer>

    <script src="scripts/teachers.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/sidemenu.js"></script>
  </body>
</html>
